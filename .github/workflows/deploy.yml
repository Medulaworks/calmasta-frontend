name: Deploy Frontend to Server

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calmasta-frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@11.5.0
          pnpm install --frozen-lockfile
      - name: Prepare environment
        run: cp .env.example .env.local
      - name: Run unit tests
        run: pnpm test
      - name: Verify build and typecheck
        run: pnpm run build

  deploy:
    needs: verify
    if: github.ref_name == 'main'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Deploy tested commit to production
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          /home/ubuntu/calmasta-frontend-shared/deploy.sh "$DEPLOY_SHA"
