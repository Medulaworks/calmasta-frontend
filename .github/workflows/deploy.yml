name: Frontend repository permissions audit
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: inspect
        options: [inspect, repair]
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref_name == 'ops/frontend-git-objects'
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect deployment repository metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,json,collections
          from pathlib import Path
          script=Path('/home/ubuntu/calmasta-frontend-shared/deploy.sh').read_text()
          candidates=set(re.findall(r'/(?:home|var|srv)/[a-zA-Z0-9_./-]+',script))|{'/home/ubuntu/calmasta-frontend'}
          print(json.dumps({'runnerUid':os.getuid(),'runnerGid':os.getgid()}))
          for root in sorted(candidates):
            base=Path(root)
            if not (base/'.git/objects').is_dir():continue
            rows=[]
            for name in ['.git','.git/objects','.git/FETCH_HEAD']:
              p=base/name
              if p.exists():
                s=p.stat();rows.append({'path':str(p),'uid':s.st_uid,'gid':s.st_gid,'mode':oct(s.st_mode&0o777),'writable':os.access(p,os.W_OK)})
            owners=collections.Counter((p.stat().st_uid,p.stat().st_gid) for p in (base/'.git/objects').rglob('*'))
            print(json.dumps({'repository':root,'metadata':rows,'objectOwners':[{'uid':k[0],'gid':k[1],'count':v} for k,v in owners.items()]}))
          PY
